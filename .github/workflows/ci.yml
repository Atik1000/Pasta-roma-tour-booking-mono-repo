name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pasta
          POSTGRES_PASSWORD: pasta
          POSTGRES_DB: pasta_roma_tour_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm --filter @pasta/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pasta:pasta@localhost:5432/pasta_roma_tour_test?schema=public

      - name: End-to-end tests
        run: pnpm --filter @pasta/api test:e2e
        env:
          TEST_DATABASE_URL: postgresql://pasta:pasta@localhost:5432/pasta_roma_tour_test?schema=public

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
