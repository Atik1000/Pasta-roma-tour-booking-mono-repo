packages:
  - "apps/*"
  - "packages/*"

# Postinstall scripts are opt-in. Native builds are allowed; the telemetry
# package (@scarf/scarf) is not.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
